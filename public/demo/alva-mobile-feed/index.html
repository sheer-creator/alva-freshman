<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0E0F">
<title>Alva Mobile — Personal Market Context</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div id="stage">
  <img class="st-logo" src="img/logo-alva.svg" alt="Alva">
  <div class="st-sub">Mobile · concept demo</div>
  <div class="st-seg">
    <button data-act="mode" data-m="immersive">Immersive</button>
    <button data-act="mode" data-m="stream">Stream</button>
  </div>
  <button class="st-reset" data-act="reset-demo">Reset demo</button>
</div>
<div id="device">
  <div id="statusbar">
    <span class="sb-time">9:41</span>
    <span class="sb-island"></span>
    <span class="sb-right">
      <svg viewBox="0 0 18 12" class="sb-signal"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg viewBox="0 0 16 12" class="sb-wifi"><path d="M8 10.6a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"/><path d="M4.9 6.9a4.6 4.6 0 0 1 6.2 0" fill="none" stroke-width="1.5"/><path d="M2.6 4.4a8 8 0 0 1 10.8 0" fill="none" stroke-width="1.5"/></svg>
      <svg viewBox="0 0 25 12" class="sb-batt"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke-width="1" opacity="0.4"/><rect x="2" y="2" width="15" height="8" rx="2"/><path d="M23.5 4v4a2.2 2.2 0 0 0 0-4Z" opacity="0.4"/></svg>
    </span>
  </div>
  <div id="app">
    <main id="pages"></main>
    <nav id="tabbar" hidden>
      <button class="tab" data-tab="home" aria-label="For You">
        <svg viewBox="0 0 24 24"><path d="M5 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M19 7h.5A1.5 1.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20H17" class="thin"/></svg>
        <span>For You</span>
      </button>
      <button class="tab" data-tab="discover" aria-label="Discover">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        <span>Discover</span>
      </button>
      <button class="tab" data-tab="ask" aria-label="Ask">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
        <span>Chat</span>
      </button>
      <button class="tab" data-tab="you" aria-label="You">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.2 4.2-5 7.5-5s6.1 1.8 7.5 5"/></svg>
        <span>You</span>
      </button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <div id="home-indicator"></div>
</div>
<script type="module" src="js/app.js"></script>
    <script src="/demo/_switcher.js" defer></script>
  </body>
</html>
