<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="leozhou" />
    <title>Official Automations · Access & Conversion Demo</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      .demo-summary {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <p class="demo-summary">
      Official Automation access demo for Alpha Radar and Portfolio Watch, with retained $1.99 and Credits-to-Pro experiments plus native Telegram or Discord messages.
    </p>
    <iframe id="demo-frame" title="Official Automation access and conversion demo"></iframe>
    <script>
      const allowedStages = new Set(['onboarding', 'day-1', 'ending-soon', 'final', 'paused']);
      const params = new URLSearchParams(window.location.search);
      const stage = allowedStages.has(params.get('stage')) ? params.get('stage') : 'onboarding';
      const plan = params.get('plan') === 'intro' || params.get('plan') === 'credits' || params.get('plan') === 'im' ? params.get('plan') : 'pass';
      const automation = params.get('automation') === 'portfolio-watch' ? 'portfolio-watch' : 'alpha-radar';
      const appUrl = new URL('../', window.location.href);
      appUrl.hash = `agent?preview=alpha-radar-pro-pass&plan=${plan}&automation=${automation}&stage=${stage}`;
      document.getElementById('demo-frame').src = appUrl.toString();
    </script>
    <script src="/demo/_switcher.js" defer></script>
  </body>
</html>
