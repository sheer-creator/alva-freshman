<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="demo-status" content="exploration">
<meta name="demo-switcher" content="off">
<meta name="demo-summary" content="For You 卡片图片 / 视频排版四个方案（A 固定网格、B 横滑各自比例、C 分页锁首图比例、D 拼贴首图方向决定）：单卡对比可逐条改媒体比例，完整页面每个方案 16 张卡对应 16 个预设；图片查看器照 Figma 8577:154099，带下滑收起；手机打开一屏一个方案。">
<title>For You 媒体排版</title>
<style>
@font-face{font-family:'Alva';src:url('../m-baby/assets/fonts/Delight-Regular.ttf') format('truetype');font-weight:400;font-display:swap;unicode-range:U+0000-2E7F;}
@font-face{font-family:'Alva';src:url('../m-baby/assets/fonts/Delight-Medium.ttf') format('truetype');font-weight:500;font-display:swap;unicode-range:U+0000-2E7F;}
@font-face{font-family:'Delight';src:url('../m-baby/assets/fonts/Delight-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'Delight';src:url('../m-baby/assets/fonts/Delight-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
@font-face{font-family:'Alva';src:local('FZLanTingHeiS-R-GB');font-weight:400;unicode-range:U+2E80-FFFF;}
@font-face{font-family:'Alva';src:local('FZLanTingHei-DB-GBK');font-weight:500;unicode-range:U+2E80-FFFF;}
:root{
  --n9:rgba(0,0,0,.9);--n7:rgba(0,0,0,.7);--n5:rgba(0,0,0,.5);--n3:rgba(0,0,0,.3);
  --l12:rgba(0,0,0,.12);--l2:rgba(0,0,0,.2);
  --br03:rgba(0,0,0,.03);--br05:rgba(0,0,0,.05);--br7:rgba(0,0,0,.7);--m7:rgba(0,0,0,.6);
  --m1:#49a3a6;--m1-10:rgba(73,163,166,.1);--b0:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:'Alva','PingFang SC',sans-serif;color:var(--n9);-webkit-font-smoothing:antialiased;font-weight:400}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;-webkit-user-drag:none;user-select:none}

/* ---------- 控制区 ---------- */
.top{padding:32px 40px 8px;display:flex;flex-direction:column;gap:16px}
.top h1{font-size:28px;line-height:36px;font-weight:500}
.ctl{display:flex;gap:16px;align-items:flex-start}
.ctl .lbl{flex:none;width:40px;font-size:14px;line-height:32px;color:var(--n5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--br05);font-size:13px;line-height:32px;color:var(--n7);white-space:nowrap}
.chip:hover{color:var(--n9)}
.chip.on{background:var(--m1-10);color:var(--m1);font-weight:500}
.item{height:32px;display:flex;align-items:center;gap:2px;padding:0 4px 0 12px;border-radius:16px;background:var(--br05);font-size:13px;color:var(--n7)}
.item .no{color:var(--n5);margin-right:6px}
.item .type{height:24px;padding:0 6px;border-radius:12px}
.item .type:hover,.item select:hover{background:var(--br05)}
.item select{appearance:none;-webkit-appearance:none;height:24px;padding:0 6px;border-radius:12px;font-size:13px}
.item .rm{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.item .rm:hover{background:var(--br05)}
.item .rm svg{width:12px;height:12px}
.add{height:32px;padding:0 12px;border-radius:16px;border:0.5px dashed var(--l2);font-size:13px;line-height:31px;color:var(--n7);cursor:pointer}
.add:hover{color:var(--n9)}

/* ---------- 舞台 ---------- */
#wrap{padding:24px 0 64px;overflow:hidden}
#stage{display:flex;gap:48px;align-items:flex-start;transform-origin:0 0;width:max-content}
.col{width:393px;display:flex;flex-direction:column;gap:16px}
.col h2{font-size:20px;line-height:28px;font-weight:500}
.col .sub{font-size:14px;line-height:22px;color:var(--n5);margin-top:2px}
.phone{position:relative;width:393px;height:852px;border-radius:44px;overflow:hidden;background:var(--b0);box-shadow:0 0 0 0.5px var(--l12)}
.feed{position:absolute;inset:0;padding-top:47px;overflow-y:auto;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}

/* ---------- For You 卡（照 Signal / For You 母件） ---------- */
.card{display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px;background:var(--b0);box-shadow:inset 0 -0.5px 0 var(--l12)}
.th{display:flex;align-items:center;gap:4px;height:20px;font-size:12px;line-height:20px;min-width:0}
.th .av20{width:20px;height:20px;border-radius:50%;flex:none}
.th .tg{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.th .own{font-weight:500;white-space:nowrap}
.th .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th svg{flex:none;width:12px;height:12px}
.qb{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:var(--br03)}
.sid{display:flex;align-items:center;gap:8px}
.sid .av32{width:32px;height:32px;border-radius:50%;flex:none}
.sid .idc{flex:1;min-width:0;display:flex;flex-direction:column}
.sid .sn{font-size:14px;line-height:22px;font-weight:500}
.sid .role,.sid .ts{font-size:12px;line-height:20px;color:var(--n5)}
.sid .ts{align-self:flex-start;flex:none}
.quote{font-size:14px;line-height:22px}
.quote .src{color:var(--n5);text-decoration:underline;text-decoration-color:var(--l2);text-underline-offset:2px}
.alva{font-size:14px;line-height:22px;padding-top:4px}
.alva svg{display:inline-block;vertical-align:-6px;margin-right:6px}
.acts{display:flex;align-items:center;gap:12px;height:28px}
.cta{flex:1;display:flex;align-items:center;gap:4px;font-size:12px;line-height:20px;color:var(--n7)}
.fb{display:flex;gap:16px}
.cta svg,.fb svg{width:16px;height:16px;display:block}

/* ---------- 媒体 ---------- */
.media{position:relative}
.cell{position:absolute;overflow:hidden;background:rgba(0,0,0,.9);cursor:pointer}
.cell>img,.cell>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rounded{border-radius:8px}
.rounded::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0.5px var(--l2);pointer-events:none;z-index:5}
.mosaic{position:relative;overflow:hidden;border-radius:8px}
.mosaic::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0.5px var(--l2);pointer-events:none;z-index:6}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.strip .cell{position:relative;flex:none}
.pager{position:relative;overflow:hidden;border-radius:8px}
.pager::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0.5px var(--l2);pointer-events:none;z-index:6}
.ptrack{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.ptrack::-webkit-scrollbar{display:none}
.ptrack .cell{position:relative;flex:none;scroll-snap-align:start}
.dragging{cursor:grabbing}
/* 视频封面态：Poster + Scrim 20% + 44 播放钮（照 Signal / Video） */
.scrim{position:absolute;inset:0;background:#000;opacity:.2;pointer-events:none}
.play{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--m7);display:flex;align-items:center;justify-content:center;pointer-events:none}
.play svg{width:32px;height:32px}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cell.playing .scrim,.cell.playing .play{display:none}
.more{position:absolute;inset:0;background:var(--br7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:32px;font-weight:500;z-index:4;pointer-events:none}
.counter{position:absolute;top:8px;right:8px;height:28px;padding:4px 8px;border-radius:999px;background:var(--br7);color:#fff;font-size:12px;line-height:20px;font-weight:500;z-index:7;pointer-events:none}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px;z-index:7;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.5}
.dots i.on{opacity:1}

/* ---------- 查看器（照 Figma Open · Image · Files 入口 8577:154099） ---------- */
.viewer{position:absolute;inset:0;background:#000;z-index:20}                 /* common/b-common-black */
.viewer[hidden]{display:none}
.vtrack{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.vtrack::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center}
.slide .cell{position:relative;background:rgba(255,255,255,.03);cursor:default}   /* content/br03（深色） */
.slide .cell[data-video]{cursor:pointer}
.vbtns{position:absolute;left:0;right:0;bottom:46px;height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:2}  /* Btns：底边 = Indicator 34 + 12 */
.vname{flex:1;min-width:0;font-size:16px;line-height:26px;letter-spacing:.16px;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  /* Regular/16 · n9 */
.vbtn{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(109,109,109,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}  /* 稿里裸值 #6D6D6D 50% + 背景模糊 8 */
.vbtn svg{width:20px;height:20px;display:block}
.vtrack{touch-action:pan-x}
.slide .cell{will-change:transform}

/* ---------- 手机打开（宽 < 768）：一屏一个方案，卡片按真机宽度铺满，查看器全屏 ---------- */
#mscheme{display:none}
.tabs{display:flex;gap:4px;padding:2px;border-radius:8px;background:var(--br05)}
.tabs button{flex:1;height:32px;border-radius:6px;font-size:13px;color:var(--n5)}
.tabs button.on{background:var(--b0);color:var(--n9);font-weight:500}
.msub{font-size:12px;line-height:20px;color:var(--n5)}
body.m .top{padding:16px 16px 12px;gap:10px}
body.m .top h1{font-size:17px;line-height:24px}
body.m .ctl{gap:8px;align-items:center}
body.m .ctl .lbl{width:auto;font-size:12px;line-height:28px}
body.m .chips{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
body.m .chips::-webkit-scrollbar{display:none}
body.m .chip{flex:none;height:28px;line-height:28px;padding:0 10px;font-size:12px}
body.m .add{flex:none;height:28px;line-height:27px;padding:0 10px;font-size:12px}
body.m .item{flex:none;height:28px;padding-left:10px;font-size:12px}
body.m .item select{font-size:12px}
body.m #mscheme{display:flex;flex-direction:column;gap:6px;margin-top:2px}
body.m #wrap{padding:0;height:auto!important;overflow:visible}
body.m #stage{display:block;transform:none!important;margin:0!important;width:auto}
body.m .col{width:auto;gap:0}
body.m .col>div:first-child{display:none}
body.m .phone{width:auto;height:auto;border-radius:0;overflow:visible;box-shadow:none}
body.m .feed{position:static;padding-top:0;overflow:visible;border-top:0.5px solid var(--l12)}
body.m .viewer{position:fixed;z-index:100}
body.noscroll{overflow:hidden}

/* ---------- 立场标（照 Alva stance Size=22：logo 块 + 1px + 标签块） ---------- */
.stance{display:inline-flex;gap:1px;height:22px;vertical-align:-6px;margin-right:6px}
.stance .lg{display:block;width:22px;height:22px;border-radius:4px 0 0 4px;background:var(--m1-10)}
.stance.none .lg{border-radius:4px}
.stance .lg svg{display:block;width:22px;height:22px}
.stance b{padding:1px 6px;font-size:12px;line-height:20px;font-weight:500;letter-spacing:.12px;border-radius:0 4px 4px 0}
.stance b.sup{color:#2a9b7d;background:rgba(42,155,125,.1)}   /* main/m3 */
.stance b.chal{color:#e05357;background:rgba(224,83,87,.1)}   /* main/m4 */
.stance b.mix{color:#e6a91a;background:rgba(230,169,26,.1)}   /* main/m5 */
.quote .smore{font-weight:500;color:var(--m1)}
/* ---------- 完整页面（照 For You · 首屏 15143:141221：状态栏 59 + 顶栏 98 + 内容 + 浮动 Tab Bar） ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--b0)}
.sbar{flex:none;width:100%;height:59px}
.fyhead{flex:none;display:flex;flex-direction:column;gap:8px;padding-bottom:16px;box-shadow:inset 0 -0.5px 0 var(--l12);background:var(--b0)}
.fytitle{padding:12px 16px 0;font-size:24px;line-height:34px;font-weight:500}
.prail{display:flex;align-items:center;height:28px}
.pview{position:relative;flex:1;min-width:0}
.ptrk{display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.ptrk::-webkit-scrollbar{display:none}
.pill{flex:none;height:28px;padding:4px 10px;border-radius:960px;background:var(--br03);color:var(--n7);font-size:12px;line-height:20px;white-space:nowrap}
.pill.on{background:var(--br7);color:rgba(255,255,255,.9)}
.pfade{position:absolute;top:0;right:0;width:24px;height:28px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);pointer-events:none}
.pmore{flex:none;width:36px;height:28px;display:flex;align-items:center;padding:0 16px 0 8px}
.pmore svg{width:12px;height:12px;display:block}
.fyscroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:109px}
.fyscroll::-webkit-scrollbar{display:none}
.tbar{position:absolute;left:0;bottom:0;width:100%;height:auto;z-index:10;pointer-events:none}
#modes{width:280px}
body.full .ctl.pctl{display:none}
.screen .feed.fyscroll{position:static;inset:auto;padding-top:0}
body.m .screen .feed.fyscroll{border-top:0}
body.m #modes{width:auto;flex:1}
body.m .screen{position:static;display:block}
body.m .sbar{display:none}
body.m .fyhead{position:sticky;top:0;z-index:5}
body.m .fyscroll{overflow:visible}
body.m .tbar{position:fixed;z-index:50}
</style>
</head>

const THEMES={dark:{bg:'#131722',grid:'#232838',up:'#26a69a',dn:'#ef5350',ma1:'#2962ff',ma2:'#ffc107',axis:'rgba(255,255,255,.45)'},
              light:{bg:'#ffffff',grid:'#eceff3',up:'#26a69a',dn:'#ef5350',ma1:'#ff9800',ma2:'#9c27b0',axis:'rgba(0,0,0,.45)'}};
const STYLES=[{kind:'candles',theme:'dark',drift:.0016},{kind:'area',theme:'light',drift:.0013},{kind:'candles',theme:'light',drift:.0011},{kind:'area',theme:'dark',drift:-.0012}];
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const seriesCache={};
function series(n,seed,drift){const k=n+'|'+seed;if(seriesCache[k])return seriesCache[k];const r=rng(seed);let p=100;const out=[];
  for(let i=0;i<n;i++){const o=p;p*=Math.exp(drift+gauss(r)*.018);const c=p;out.push({o,c,h:Math.max(o,c)*(1+Math.abs(gauss(r))*.006),l:Math.min(o,c)*(1-Math.abs(gauss(r))*.006),v:Math.abs(gauss(r)*.4+1)+.2})}
  return seriesCache[k]=out}
function drawChart(cv,st,seed,prog=1){
  const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,T=THEMES[st.theme],u=Math.sqrt(w*h)/600;
  ctx.fillStyle=T.bg;ctx.fillRect(0,0,w,h);
  const padL=w*.035,padR=Math.max(64*u,w*.12),top=h*.07,bot=h*.05,volH=st.kind==='candles'?h*.17:0,plotB=h-bot-volH-(volH?h*.03:0);
  ctx.strokeStyle=T.grid;ctx.lineWidth=Math.max(1,u);
  for(let i=0;i<=6;i++){const y=Math.round(top+(plotB-top)*i/6)+.5;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke()}
  for(let i=0;i<=6;i++){const x=Math.round(padL+(w-padR-padL)*i/6)+.5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,h-bot);ctx.stroke()}
  const n=st.kind==='candles'?Math.max(24,Math.min(70,Math.round((w-padL-padR)/(13*u)))):150;
  const d=series(n,seed,st.drift),k=Math.max(3,Math.floor(n*prog));
  let lo=Infinity,hi=-Infinity,vmax=0;d.forEach(x=>{lo=Math.min(lo,x.l);hi=Math.max(hi,x.h);vmax=Math.max(vmax,x.v)});
  const Y=v=>top+(plotB-top)*(1-(v-lo)/(hi-lo)),cw=(w-padL-padR)/n,X=i=>padL+cw*i+cw/2;
  ctx.font=`${Math.round(11*u)}px Delight, sans-serif`;ctx.fillStyle=T.axis;ctx.textBaseline='middle';
  for(let i=0;i<=6;i++){const v=hi-(hi-lo)*i/6;ctx.fillText(v.toFixed(2),w-padR+8*u,top+(plotB-top)*i/6)}
  const last=d[k-1].c,upc=last>=d[0].o,col=upc?T.up:T.dn;
  if(st.kind==='candles'){
    const bw=Math.max(2,cw*.62);
    for(let i=0;i<k;i++){const x=d[i],c=x.c>=x.o?T.up:T.dn;ctx.fillStyle=c;
      ctx.fillRect(X(i)-Math.max(1,u*.8)/2,Y(x.h),Math.max(1,u*.8),Y(x.l)-Y(x.h));
      const y0=Math.min(Y(x.o),Y(x.c)),y1=Math.max(Y(x.o),Y(x.c));ctx.fillRect(X(i)-bw/2,y0,bw,Math.max(1.5,y1-y0));
      const vb=h-bot;ctx.globalAlpha=.5;ctx.fillRect(X(i)-bw/2,vb-volH*x.v/vmax,bw,volH*x.v/vmax);ctx.globalAlpha=1}
    [[7,T.ma1],[20,T.ma2]].forEach(([m,c])=>{ctx.strokeStyle=c;ctx.lineWidth=2*u;ctx.beginPath();
      for(let i=0;i<k;i++){const s=d.slice(Math.max(0,i-m+1),i+1);const a=s.reduce((p,q)=>p+q.c,0)/s.length;i?ctx.lineTo(X(i),Y(a)):ctx.moveTo(X(i),Y(a))}ctx.stroke()});
  }else{
    const g=ctx.createLinearGradient(0,top,0,plotB);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
    ctx.beginPath();ctx.moveTo(X(0),plotB);for(let i=0;i<k;i++)ctx.lineTo(X(i),Y(d[i].c));ctx.lineTo(X(k-1),plotB);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();for(let i=0;i<k;i++)i?ctx.lineTo(X(i),Y(d[i].c)):ctx.moveTo(X(i),Y(d[i].c));ctx.strokeStyle=col;ctx.lineWidth=2.4*u;ctx.lineJoin='round';ctx.stroke();

}

function schemeA(){const n=items.length;if(n===1)return single();const H=Math.round(W*9/16),hh=(H-G)/2;

function schemeC(){const n=items.length,H=Math.round(W/clampR(rv(items[0].r)));
  const p=document.createElement('div');p.className='pager';p.style.width=W+'px';p.style.height=H+'px';
  const t=document.createElement('div');t.className='ptrack';p.appendChild(t);
  items.forEach((it,i)=>t.appendChild(cell(it,i,{w:W,h:H})));
  if(n>1){const cn=document.createElement('div');cn.className='counter';cn.textContent='1/'+n;p.appendChild(cn);
    const dt=document.createElement('div');dt.className='dots';dt.innerHTML=items.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');p.appendChild(dt);
    t.addEventListener('scroll',()=>{const k=Math.round(t.scrollLeft/W);cn.textContent=(k+1)+'/'+n;dt.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===k))})}
  dragScroll(t,true);return p}

/* D · 拼贴：首图横 → 上大下小；首图竖 → 左大右小；5 张起 2 + 3，第 5 格 +N */
function schemeD(){const n=items.length;if(n===1)return single();const L=rv(items[0].r)>1;
  if(n===2){const H=L?Math.round(half):Math.round(half*4/3);return mosaic([{i:0,x:0,y:0,w:half,h:H},{i:1,x:half+G,y:0,w:half,h:H}],H)}
  if(n===3){if(L){const t=Math.round(W*9/16),b=sz(94);return mosaic([{i:0,x:0,y:0,w:W,h:t},{i:1,x:0,y:t+G,w:half,h:b},{i:2,x:half+G,y:t+G,w:half,h:b}],t+G+b)}
    const H=sz(296),lw=sz(222),rw=W-lw-G,rh=(H-G)/2;return mosaic([{i:0,x:0,y:0,w:lw,h:H},{i:1,x:lw+G,y:0,w:rw,h:rh},{i:2,x:lw+G,y:rh+G,w:rw,h:rh}],H)}
  if(n===4){if(L){const t=Math.round(W*9/16),b=sz(110),tw=(W-2*G)/3;return mosaic([{i:0,x:0,y:0,w:W,h:t},...[1,2,3].map((i,k)=>({i,x:k*(tw+G),y:t+G,w:tw,h:b}))],t+G+b)}
    const H=sz(296),lw=sz(222),rw=W-lw-G,rh=(H-2*G)/3;return mosaic([{i:0,x:0,y:0,w:lw,h:H},...[1,2,3].map((i,k)=>({i,x:lw+G,y:k*(rh+G),w:rw,h:rh}))],H)}
  const t=sz(125),b=sz(110),tw=(W-2*G)/3;
  return mosaic([{i:0,x:0,y:0,w:half,h:t},{i:1,x:half+G,y:0,w:half,h:t},...[2,3,4].map((i,k)=>({i,x:k*(tw+G),y:t+G,w:tw,h:b,more:i===4&&n>5?n-5:0}))],t+G+b)}

const SCHEMES=[
  {k:'A',t:'A · 固定网格',s:'最多 4 张 · X 旧版 / Bluesky / Mastodon',f:schemeA},
  {k:'B',t:'B · 横滑 · 各自比例',s:'行高 135 · Threads / X 2026 / Bluesky 5 张起',f:schemeB},
  {k:'C',t:'C · 分页 · 整组锁首图比例',s:'Instagram / 小红书 / Reddit',f:schemeC},
  {k:'D',t:'D · 拼贴 · 首图方向决定布局',s:'Facebook / LinkedIn',f:schemeD},
];

/* =================== 拖动滑动（鼠标；触控走原生） =================== */
function dragScroll(el,snap){let sx=0,sl=0,down=false,moved=false,scale=1;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=el.scrollLeft;scale=el.getBoundingClientRect().width/el.offsetWidth||1});
  el.addEventListener('pointermove',e=>{if(!down)return;const dx=(e.clientX-sx)/scale;
    if(!moved&&Math.abs(dx)>4){moved=true;el.setPointerCapture(e.pointerId);el.style.scrollSnapType='none';el.classList.add('dragging')}
    if(moved)el.scrollLeft=sl-dx});
  const up=e=>{if(!down)return;down=false;if(!moved)return;el.classList.remove('dragging');el._drag=true;setTimeout(()=>el._drag=false,0);
    if(snap){const dx=(e.clientX-sx)/scale,w=el.clientWidth,max=Math.round((el.scrollWidth-w)/w);let k=Math.round(sl/w);
      if(dx<-40)k++;else if(dx>40)k--;k=Math.max(0,Math.min(max,k));el.scrollTo({left:k*w,behavior:'smooth'});setTimeout(()=>el.style.scrollSnapType='',500)}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{if(el._drag){e.stopPropagation();e.preventDefault()}},true)}

/* =================== 视频：封面 → 加载 → 播放（照 Signal / Video 的 Cover / Loading / Playing） =================== */
const playing=new Map();
function toggleVideo(c,scope){
  if(c.classList.contains('playing')){stopVideo(c);return}
  if(c.classList.contains('loading'))return;
  scope.querySelectorAll('.cell.playing,.cell.loading').forEach(stopVideo);
  c.classList.add('loading');c.querySelector('.play').insertAdjacentHTML('beforeend','<div class="ring"></div>');
  c._t=setTimeout(()=>{c.classList.remove('loading');c.querySelector('.ring')?.remove();c.classList.add('playing');
    const i=+c.dataset.i+c._off,[w,h]=natural(rv(c._it.r),640),cv=document.createElement('canvas');cv.width=w;cv.height=h;
    c.insertBefore(cv,c.querySelector('.scrim'));playing.set(c,{cv,st:STYLES[i%4],seed:i*97+13,t0:performance.now()})},700)}
function stopVideo(c){clearTimeout(c._t);c.classList.remove('loading','playing');c.querySelector('.ring')?.remove();const p=playing.get(c);if(p){p.cv.remove();playing.delete(c)}}
let lastT=0;(function tick(t){if(t-lastT>33){lastT=t;playing.forEach((p,c)=>{if(!c.isConnected){playing.delete(c);return}
  drawChart(p.cv,p.st,p.seed,.12+.88*(((t-p.t0)/9000)%1))})}requestAnimationFrame(tick)})(0);

/* =================== 查看器 =================== */
function openViewer(col,idx,card){
  const v=col.querySelector('.viewer'),track=v.querySelector('.vtrack');track.innerHTML='';v.hidden=false;v._card=card;v._items=items;v._off=OFF;
  if(isM())document.body.classList.add('noscroll');
  const TH=track.clientHeight,VW=track.clientWidth;
  items.forEach((it,i)=>{const s=document.createElement('div');s.className='slide';const r=rv(it.r);
    let w=VW,h=VW/r;if(h>TH){h=TH;w=TH*r}s.appendChild(cell(it,i,{w:Math.round(w),h:Math.round(h)}));track.appendChild(s)});
  track.style.scrollSnapType='none';track.scrollLeft=idx*VW;requestAnimationFrame(()=>track.style.scrollSnapType='');
  updViewer(col);col._viewer=true;active=col}
function updViewer(col){const v=col.querySelector('.viewer'),its=v._items||items,t=v.querySelector('.vtrack'),k=Math.min(its.length-1,Math.round(t.scrollLeft/t.clientWidth));
  v.querySelector('.vname').textContent=its[k]&&its[k].type==='video'?'video.mp4':'image.png'}
function closeViewer(col){const v=col.querySelector('.viewer');v.querySelectorAll('.cell').forEach(stopVideo);v.hidden=true;col._viewer=false;document.body.classList.remove('noscroll')}
function stepViewer(col,d){const t=col.querySelector('.vtrack');const w=t.clientWidth;t.scrollTo({left:(Math.round(t.scrollLeft/w)+d)*w,behavior:'smooth'})}
let active=null;
document.addEventListener('keydown',e=>{if(!active||!active._viewer)return;if(e.key==='Escape')closeViewer(active);if(e.key==='ArrowRight')stepViewer(active,1);if(e.key==='ArrowLeft')stepViewer(active,-1)});

/* =================== 查看器手势：左右翻页 + 下滑收起 =================== */
const EASE='cubic-bezier(.2,.8,.2,1)';
function phoneScale(col){const v=col.querySelector('.viewer');return v.getBoundingClientRect().width/v.offsetWidth||1}
function viewerGesture(col,v,vt){
  let st=null;const btns=v.querySelector('.vbtns');
  const curCell=()=>{const k=Math.round(vt.scrollLeft/vt.clientWidth);return vt.children[k]&&vt.children[k].querySelector('.cell')};
  vt.addEventListener('pointerdown',e=>{if(e.button!==0||v._anim)return;const t=performance.now();
    st={id:e.pointerId,x:e.clientX,y:e.clientY,sl:vt.scrollLeft,mode:null,sc:phoneScale(col),py:e.clientY,pt:t,vy:0,touch:e.pointerType!=='mouse'}});
  vt.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;
    const dx=(e.clientX-st.x)/st.sc,dy=(e.clientY-st.y)/st.sc;
    if(!st.mode){if(Math.hypot(dx,dy)<6)return;
      if(dy>0&&Math.abs(dy)>Math.abs(dx)){st.mode='dismiss';st.cell=curCell();originCell(col,Math.round(vt.scrollLeft/vt.clientWidth));vt.setPointerCapture(e.pointerId);if(st.cell)st.cell.style.transition='none';v.style.transition='none';btns.style.transition='none'}
      else if(!st.touch){st.mode='pan';vt.setPointerCapture(e.pointerId);vt.style.scrollSnapType='none';vt.classList.add('dragging')}
      else{st=null;return}}
    const now=performance.now();st.vy=((e.clientY-st.py)/st.sc)/Math.max(1,now-st.pt);st.py=e.clientY;st.pt=now;
    if(st.mode==='pan'){vt.scrollLeft=st.sl-dx;return}
    const d=Math.max(0,dy),sc=1-Math.min(d/400,1)*.3,a=Math.max(0,1-d/350);   /* 跟手：最多缩到 0.7，黑底 350 内淡出 */
    if(st.cell)st.cell.style.transform=`translate(${dx}px,${d}px) scale(${sc})`;
    v.style.background=`rgba(0,0,0,${a})`;btns.style.opacity=a});
  const end=e=>{if(!st||e.pointerId!==st.id)return;const s0=st;st=null;if(!s0.mode)return;
    vt._drag=true;setTimeout(()=>vt._drag=false,0);
    if(s0.mode==='pan'){vt.classList.remove('dragging');const dx=(e.clientX-s0.x)/s0.sc,max=(v._items||items).length-1,vw=vt.clientWidth;let k=Math.round(s0.sl/vw);
      if(dx<-40)k++;else if(dx>40)k--;k=Math.max(0,Math.min(max,k));vt.scrollTo({left:k*vw,behavior:'smooth'});setTimeout(()=>vt.style.scrollSnapType='',500);return}
    const dy=(e.clientY-s0.y)/s0.sc;
    if(e.type!=='pointercancel'&&(dy>100||(dy>30&&s0.vy>.5)))dismiss(col,v,vt,s0.cell);else springBack(v,s0.cell)};
  vt.addEventListener('pointerup',end);vt.addEventListener('pointercancel',end);
  vt.addEventListener('click',e=>{if(vt._drag||v._anim){e.stopImmediatePropagation();e.preventDefault()}},true)}
function springBack(v,cell){const btns=v.querySelector('.vbtns'),t='220ms '+EASE;
  v.style.transition='background '+t;btns.style.transition='opacity '+t;v.style.background='';btns.style.opacity='';
  if(cell){cell.style.transition='transform '+t;cell.style.transform=''}
  setTimeout(()=>{v.style.transition='';btns.style.transition='';if(cell)cell.style.transition=''},240)}
/* 收起时回到卡片里对应那一格：C 分页、B 横滑先把对应那张滚到可见；A / D 超出可见格数的回到 +N 格 */
function originCell(col,k){const feed=col.querySelector('.viewer')._card||col.querySelector('.card');
  const pt=feed.querySelector('.ptrack');if(pt){pt.style.scrollSnapType='none';pt.scrollLeft=k*W;pt.style.scrollSnapType=''}
  let c=feed.querySelector(`.cell[data-i="${k}"]`)||feed.querySelector('.cell[data-more]');
  const sp=feed.querySelector('.strip');if(sp&&c){const sc=phoneScale(col),cr=c.getBoundingClientRect(),sr=sp.getBoundingClientRect();
    if(cr.left<sr.left||cr.right>sr.right)sp.scrollLeft+=(cr.left-sr.left)/sc}
  return c}
function dismiss(col,v,vt,cell){
  const k=Math.round(vt.scrollLeft/vt.clientWidth),btns=v.querySelector('.vbtns'),dur=280,t=dur+'ms '+EASE;v._anim=true;
  v.style.transition='background '+t;btns.style.transition='opacity '+t;v.style.background='rgba(0,0,0,0)';btns.style.opacity=0;
  const tg=originCell(col,k);
  if(cell&&tg){const sc=phoneScale(col),ph=v.getBoundingClientRect(),tr=tg.getBoundingClientRect();
    const R0={x:cell.offsetLeft,y:cell.offsetTop,w:cell.offsetWidth,h:cell.offsetHeight};
    const Rt={x:(tr.left-ph.left)/sc,y:(tr.top-ph.top)/sc,w:tr.width/sc,h:tr.height/sc};
    const u=Math.max(Rt.w/R0.w,Rt.h/R0.h),ix=(R0.w-Rt.w/u)/2,iy=(R0.h-Rt.h/u)/2;
    const rad=(tg.closest('.mosaic')&&tg.closest('.mosaic').children.length>1)?0:8/u;
    const tx=(Rt.x+Rt.w/2)-(R0.x+R0.w/2),ty=(Rt.y+Rt.h/2)-(R0.y+R0.h/2);
    cell.style.transition='none';cell.style.clipPath='inset(0px 0px 0px 0px round 0px)';cell.offsetWidth;
    cell.style.transition=`transform ${t},clip-path ${t}`;
    cell.style.transform=`translate(${tx}px,${ty}px) scale(${u})`;cell.style.clipPath=`inset(${iy}px ${ix}px ${iy}px ${ix}px round ${rad}px)`}
  else if(cell){cell.style.transition=`transform ${t},opacity ${t}`;cell.style.transform+=' translateY(300px)';cell.style.opacity=0}
  setTimeout(()=>{closeViewer(col);v._anim=false;v.style.cssText='';btns.style.cssText='';
    if(cell){cell.style.transition='';cell.style.transform='';cell.style.clipPath='';cell.style.opacity=''}},dur+20)}

/* =================== 卡片 & 渲染 =================== */
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function stanceHTML(st){const c={Supports:'sup',Challenges:'chal',Mixed:'mix'}[st];return `<span class="stance${c?'':' none'}"><i class="lg">${SVG.logo}</i>${c?`<b class="${c}">${st}</b>`:''}</span>`}
function cardHTML(d){return `<article class="card">
 <div class="th"><img class="av20" src="${AVS[d.oa]}" alt=""><div class="tg"><span class="own">${esc(d.o)}</span><span class="own">·</span><span class="tt">${esc(d.th)}</span></div>${SVG.arrow}</div>
 <div class="qb">
  <div class="sid"><img class="av32" src="${AVS[d.sa]}" alt=""><div class="idc"><div class="sn">${esc(d.s)}</div>${d.r?`<div class="role">${esc(d.r)}</div>`:''}</div><div class="ts">${d.t}</div></div>
  <p class="quote">${esc(d.q)} ${d.more?'<span class="smore">Show more</span>':`<span class="src">${d.lk}</span>`}</p>
  <div class="media"></div>
 </div>
 <p class="alva">${stanceHTML(d.st)}${esc(d.a)}</p>
 <div class="acts"><div class="cta">${SVG.chat}<span>Ask Alva</span></div><div class="fb">${SVG.like}${SVG.close}</div></div>
</article>`}
const PILLS=['All','Chips','Memory','Hyperscaler','Neocloud','Enterprise AI','Agent Infra','Consumer AI','Space','Interconnect','Power','Crypto','Financials','Healthcare','Energy & Materials','Consumer','Industrials','Macro'];
const FYHEAD=()=>`<div class="fyhead"><div class="fytitle">For You</div><div class="prail"><div class="pview"><div class="ptrk">${PILLS.map((p,i)=>`<span class="pill${i?'':' on'}">${esc(p)}</span>`).join('')}</div><div class="pfade"></div></div><span class="pmore">${SVG.adown}</span></div></div>`;
const stage=document.getElementById('stage');
function build(){stage.innerHTML='';setMetrics();
  (isM()?[SCHEMES[cur]]:SCHEMES).forEach(sc=>{const col=document.createElement('section');col.className='col';
    const VIEWER=`<div class="viewer" hidden><div class="vtrack"></div>
      <div class="vbtns"><span class="vname"></span><button class="vbtn" aria-label="删除">${SVG.del}</button><button class="vbtn" aria-label="下载">${SVG.dl}</button></div></div>`;
    const head=`<div><h2>${sc.t}</h2><div class="sub">${sc.s}</div></div>`;
    if(MODE==='single'){
      col.innerHTML=`${head}<div class="phone"><div class="feed">${cardHTML(CONTENT[0])}</div>${VIEWER}</div>`;stage.appendChild(col);
      const card=col.querySelector('.card');items=PLAY;OFF=0;card._items=items;card._off=0;card.querySelector('.media').appendChild(sc.f());
    }else{
      col.innerHTML=`${head}<div class="phone"><div class="screen">${isM()?'':`<img class="sbar" src="${IMG_SB}" alt="">`}${FYHEAD()}<div class="feed fyscroll">${CONTENT.map(cardHTML).join('')}</div><img class="tbar" src="${IMG_TB}" alt=""></div>${VIEWER}</div>`;stage.appendChild(col);
      col.querySelectorAll('.card').forEach((card,j)=>{items=PRESETS[j][1].map(([type,r])=>({type,r}));OFF=j*5;card._items=items;card._off=OFF;card.querySelector('.media').appendChild(sc.f())});
      items=PLAY;OFF=0;
    }
    const feed=col.querySelector('.feed'),v=col.querySelector('.viewer'),vt=v.querySelector('.vtrack');
    feed.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;const card=c.closest('.card');items=card._items;OFF=card._off;
      if(c.dataset.video&&!c.dataset.more)toggleVideo(c,col);else openViewer(col,+c.dataset.i,card)});
    vt.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c){closeViewer(col);return}if(c.dataset.video)toggleVideo(c,v)});
    vt.addEventListener('scroll',()=>updViewer(col));viewerGesture(col,v,vt);
    col.addEventListener('pointerdown',()=>active=col)});
  fit()}
function fit(){if(isM()){stage.style.transform='';stage.style.marginLeft='';document.getElementById('wrap').style.height='';return}
  const nat=stage.scrollWidth,avail=innerWidth-80,s=Math.min(1,avail/nat);
  stage.style.transform=`scale(${s})`;stage.style.marginLeft=Math.max(40,(innerWidth-nat*s)/2)+'px';
  document.getElementById('wrap').style.height=(stage.offsetHeight*s+88)+'px'}
let lastMode=null,lastW=innerWidth,rz;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const m=isM();if(m!==lastMode||(m&&innerWidth!==lastW)){lastW=innerWidth;refresh()}else fit()},120)});

/* =================== 控制区 =================== */
const same=(a,b)=>a.length===b.length&&a.every((x,i)=>x.type===b[i][0]&&x.r===b[i][1]);
function controls(){
  const P=document.getElementById('presets');P.innerHTML='';
  PRESETS.forEach(([name,list])=>{const b=document.createElement('button');b.className='chip'+(same(items,list)?' on':'');b.textContent=name;
    b.onclick=()=>{PLAY=list.map(([type,r])=>({type,r}));refresh()};P.appendChild(b)});
  const I=document.getElementById('items');I.innerHTML='';
  items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';
    d.innerHTML=`<span class="no">${i+1}</span><button class="type">${it.type==='video'?'视频':'图片'}</button><select>${RATIOS.map(r=>`<option${r===it.r?' selected':''}>${r}</option>`).join('')}</select>${items.length>1?`<button class="rm" aria-label="删除">${SVG.close}</button>`:''}`;
    d.querySelector('.type').onclick=()=>{it.type=it.type==='video'?'img':'video';refresh()};
    d.querySelector('select').onchange=e=>{it.r=e.target.value;refresh()};
    const rm=d.querySelector('.rm');if(rm)rm.onclick=()=>{items.splice(i,1);refresh()};
    I.appendChild(d)});
  if(items.length<9){[['img','+ 图片'],['video','+ 视频']].forEach(([type,label])=>{const a=document.createElement('button');a.className='add';a.textContent=label;
    a.onclick=()=>{items.push({type,r:type==='video'?'16:9':'1:1'});refresh()};I.appendChild(a)})}}
function tabs(){const T=document.getElementById('tabs');T.innerHTML='';
  ['A 网格','B 横滑','C 分页','D 拼贴'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(i===cur)b.className='on';b.onclick=()=>{cur=i;refresh()};T.appendChild(b)});
  document.getElementById('msub').textContent=SCHEMES[cur].t+' · '+SCHEMES[cur].s}
function modes(){const M=document.getElementById('modes');M.innerHTML='';
  [['single','单卡对比'],['full','完整页面']].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;if(k===MODE)b.className='on';b.onclick=()=>{MODE=k;refresh()};M.appendChild(b)})}
function refresh(){items=PLAY;OFF=0;modes();document.body.classList.toggle('full',MODE==='full');lastMode=isM();document.body.classList.toggle('m',lastMode);document.body.classList.remove('noscroll');playing.clear();controls();tabs();build()}
(document.fonts?document.fonts.ready:Promise.resolve()).then(refresh);
</script>
