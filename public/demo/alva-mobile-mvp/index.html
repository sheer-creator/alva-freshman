<meta name="theme-color" content="#15161A">
<title>Alva Mobile MVP — Alpha & Following</title>
<script>
  (() => {
    let theme = 'dark';
    try {
      const saved = JSON.parse(localStorage.getItem('alva_mvp_demo_v1') || '{}');
      if (saved.theme === 'light') theme = 'light';
    } catch (_) {}
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#F6F6F6' : '#15161A';
  })();
</script>
