<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="demo-summary" content="Alva 推送动效研究：用户停在其他 tab 时，新消息点亮 Alva tab 的绿点，并在其正上方弹出收件预览，含多条消息叠放。">
  <title>Alva · 消息推送预览动效</title>
  <style>
    @font-face { font-family: Delight; src: url('../m-baby/assets/fonts/Delight-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: Delight; src: url('../m-baby/assets/fonts/Delight-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
    /* 中文走本机已装的方正兰亭黑（仓库不带字体文件）：400 → 准黑，500 → 中黑；Delight 没有的汉字自动落到这里 */
    @font-face { font-family: FZLanTingHei; src: local('FZLanTingHei-M-GBK'), local('方正兰亭准黑_GBK'); font-weight: 400; }
    @font-face { font-family: FZLanTingHei; src: local('FZLanTingHei-DB-GBK'), local('方正兰亭中黑_GBK'); font-weight: 500; }

    :root {
      --b0: #fff;
      --n9: rgba(0, 0, 0, .9);
      --n7: rgba(0, 0, 0, .7);
      --n5: rgba(0, 0, 0, .5);
      --l2: rgba(0, 0, 0, .2);
      --l12: rgba(0, 0, 0, .12);
      --m1: #49a3a6;
      --shadow-floating: 0 2px 16px rgba(0, 0, 0, .08);
      --ease: cubic-bezier(.2, 0, 0, 1);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f4f6f6; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; color: var(--n9); font-family: Delight, FZLanTingHei, 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; }
    button { font: inherit; color: inherit; }
    .page { width: min(100%, 980px); }
    .intro { margin: 0; }
    .kicker { margin: 0 0 8px; color: var(--m1); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 500; }
    .lede { margin: 8px 0 0; color: var(--n5); font-size: 14px; line-height: 22px; }
    .stage { display: flex; align-items: flex-start; justify-content: center; gap: 40px; }
    .side { flex: none; align-self: center; display: flex; flex-direction: column; gap: 28px; width: 320px; }
    .phone-wrap { flex: none; width: 440px; height: 956px; }
    .phone-screen { position: relative; width: 440px; height: 956px; overflow: hidden; border-radius: 44px; background: var(--b0); box-shadow: 0 0 0 .5px var(--l2), 0 18px 50px rgba(0, 0, 0, .12); transform-origin: top left; }

    /* screen content: Figma exports with the tab bar cropped off */
    .shot { position: absolute; left: 0; top: 0; width: 440px; height: 874px; background: var(--b0) no-repeat top left / 440px auto; transition: opacity .2s ease; }
    .shot.foryou { background-image: url('for-you.png'); }
    .shot.alva { background-image: url('alva-chat.png'); opacity: 0; }
    .screen[data-tab="alva"] .shot.foryou { opacity: 0; }
    .screen[data-tab="alva"] .shot.alva { opacity: 1; }

    /* tab bar — Feed-Mobile-MVP · For You / V5 (10378:152214) */
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; height: 82px; background: var(--b0); border-top: .5px solid var(--l12); }
    .tabs { display: flex; height: 48px; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px; border: 0; background: none; color: var(--n7); font-size: 10px; line-height: 16px; cursor: pointer; transition: color .2s ease; }
    .tab.on { color: var(--n9); font-weight: 500; }
    .tab .ic { position: relative; width: 22px; height: 22px; }
    .tab .ic svg { position: absolute; inset: 0; transition: opacity .2s ease; }
    .tab .ic .f { opacity: 0; }
    .tab.on .ic .l { opacity: 0; }
    .tab.on .ic .f { opacity: 1; }
    .dot { position: absolute; left: 15.6px; top: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--m1); box-shadow: 0 0 0 1px #fff; opacity: 0; transform: scale(.3); transition: opacity .16s ease-in, transform .16s ease-in; }
    .screen[data-dot="on"] .dot { opacity: 1; transform: none; transition: opacity .2s ease-out .12s, transform .4s var(--spring) .12s; }
    .indicator { position: relative; height: 34px; }
    .indicator i { position: absolute; top: 21px; left: 50%; width: 144px; height: 5px; margin-left: -72px; border-radius: 100px; background: #000; }

    /* Inbox notification pop — Feed-Mobile-MVP 10378:153511: 408×76, 8px above the tab bar */
    .pops { position: absolute; left: 16px; right: 16px; bottom: 90px; z-index: 2; height: 76px; pointer-events: none; }
    .pop { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; align-items: flex-start; gap: 8px; padding: 16px; border-radius: 12px; background: var(--b0); box-shadow: inset 0 0 0 .5px var(--l2), var(--shadow-floating); cursor: pointer; pointer-events: auto; opacity: 0; transform: translateY(84px); transform-origin: center bottom; transition: transform .44s var(--ease), opacity .2s ease-out; }
    .pop.in { opacity: 1; transform: none; }
    .pop.in[data-pos="1"] { transform: translateY(-9px) scale(.96); }
    .pop.in[data-pos="2"] { transform: translateY(-18px) scale(.92); }
    .pop[data-pos="0"] { z-index: 3; }
    .pop[data-pos="1"] { z-index: 2; }
    .pop[data-pos="2"] { z-index: 1; }
    .pop.out { opacity: 0; transform: translateY(84px); transition: transform .32s ease-in, opacity .16s ease-in .14s; }
    .pop .av { position: relative; flex: none; width: 32px; height: 32px; }
    .pop .av svg { display: block; }
    .pop .av i { position: absolute; left: 24.3px; top: 24px; width: 8px; height: 8px; border-radius: 50%; background: var(--m1); box-shadow: 0 0 0 1px #fff; }
    .pop .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pop .msg { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--n9); font-size: 14px; line-height: 22px; }
    .pop .time { color: var(--n5); font-size: 12px; line-height: 20px; }
    .pop .close { flex: none; width: 16px; height: 16px; display: grid; place-items: center; }
    .pop .close svg { display: block; }

    .controls { display: flex; flex-direction: column; gap: 16px; }
    .control-group { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .control-label { margin: 0 0 -2px 12px; color: var(--n5); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; }
    .control-group button { min-width: 150px; height: 32px; padding: 0 12px; border: 0; border-radius: 960px; background: #fff; box-shadow: inset 0 0 .5px var(--l2); font-size: 14px; line-height: 20px; text-align: left; cursor: pointer; }
    .control-group button[aria-pressed="true"] { background: var(--n9); color: #fff; box-shadow: none; }
    .caption { margin: 0; color: var(--n5); font-size: 12px; line-height: 18px; }
    @media (max-width: 720px) {
      body { align-items: flex-start; padding-top: 20px; }
      .stage { flex-direction: column; align-items: center; gap: 20px; }
      .side { display: contents; }
      .intro { order: -1; width: 100%; max-width: 440px; }
      .controls { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .control-group { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .caption { width: 100%; max-width: 440px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shot, .tab, .tab .ic svg, .dot, .pop { transition: none !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const wrap = document.getElementById('phoneWrap');
      const stage = document.querySelector('.stage');
      const side = document.querySelector('.side');
      const screen = document.getElementById('screen');
      const pops = document.getElementById('pops');
      const template = document.getElementById('popTemplate');
      const stateButtons = [...document.querySelectorAll('[data-go]')];
      const tabButtons = [...document.querySelectorAll('.tab')];
      const autoButton = document.getElementById('auto');
      const messages = [
        { text: 'AI chip supply chain — Samsung teases new HBM5 with twice the performance of HBM4E -ambitious data transfer rates could hint at 4,096-bit interface', time: '2 minutes ago' },
        { text: 'Alibaba Group Holding’s open-weight AI models accumulated more than 3 billion global downloads during the past six months.', time: '1 minute ago' },
        { text: 'BTC closed the 4H candle at $68,420, above its three-day range high of $67,900 on rising spot volume.', time: 'Just now' }
      ];
      const sequence = [['idle', 1200], ['one', 3600], ['dot', 1500], ['burst', 4800], ['dot', 1500], ['opened', 2400]];
      let state = 'idle', index = 0, timer = 0, auto = true;
      let burstTimers = [];

      function fit() {
        // Reserve the real page chrome (body padding) and, beside the phone, the side column — not a guessed 120px.
        const bodyStyle = getComputedStyle(document.body);
        const chrome = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
        const stacked = window.matchMedia('(max-width: 720px)').matches;
        const beside = stacked ? 0 : side.offsetWidth + parseFloat(getComputedStyle(stage).columnGap || '0');
        const byWidth = (window.innerWidth - 32 - beside) / 440;
        const available = stacked ? byWidth : Math.min((window.innerHeight - chrome) / 956, byWidth);
        const scale = Math.min(1, Math.max(.3, available));
        screen.style.transform = scale === 1 ? '' : `scale(${scale})`;
        wrap.style.width = `${440 * scale}px`;
        wrap.style.height = `${956 * scale}px`;
      }

      function setTab(tab) {
        screen.dataset.tab = tab;
        tabButtons.forEach(button => button.classList.toggle('on', button.dataset.tab === tab));
      }

      function livePops() { return [...pops.querySelectorAll('.pop:not(.out)')]; }

      function clearPops(animated) {
        burstTimers.forEach(window.clearTimeout); burstTimers = [];
        const all = [...pops.querySelectorAll('.pop')];
        if (!animated) { all.forEach(p => p.remove()); return; }
        all.forEach(p => { p.classList.add('out'); p.classList.remove('in'); window.setTimeout(() => p.remove(), 520); });
      }

      function makePop(message) {
        const pop = template.content.firstElementChild.cloneNode(true);
        pop.querySelector('.msg').textContent = message.text;
        pop.querySelector('.time').textContent = message.time;
        pop.setAttribute('aria-label', 'Open the new Alva message');
        pop.addEventListener('click', openFromPop);
        pop.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openFromPop(event); } });
        pop.querySelector('.close').addEventListener('click', event => { event.stopPropagation(); dismiss(); });
        return pop;
      }

      function pushMessage(message) {
        const live = livePops();
        live.forEach(p => {
          const pos = Number(p.dataset.pos || 0) + 1;
          if (pos > 2) { p.classList.add('out'); p.classList.remove('in'); window.setTimeout(() => p.remove(), 520); }
          else p.dataset.pos = String(pos);
        });
        const pop = makePop(message);
        pop.dataset.pos = '0';
        pops.appendChild(pop);
        void pop.offsetWidth;
        pop.classList.add('in');
      }

      function showBurst() {
        clearPops(false);
        messages.forEach((message, i) => {
          burstTimers.push(window.setTimeout(() => pushMessage(message), i * 650));
        });
      }

      function go(next) {
        if (next === 'one') { setTab('foryou'); clearPops(false); pushMessage(messages[0]); screen.dataset.dot = 'on'; }
        else if (next === 'burst') { setTab('foryou'); showBurst(); screen.dataset.dot = 'on'; }
        else if (next === 'dot') { setTab('foryou'); clearPops(true); screen.dataset.dot = 'on'; }
        else if (next === 'opened') { clearPops(true); screen.dataset.dot = 'off'; setTab('alva'); }
        else { setTab('foryou'); clearPops(true); screen.dataset.dot = 'off'; }
        state = next;
        stateButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.go === next)));
      }

      function tick() {
        window.clearTimeout(timer);
        if (!auto) return;
        const [next, hold] = sequence[index];
        go(next);
        timer = window.setTimeout(() => { index = (index + 1) % sequence.length; tick(); }, hold);
      }

      function jump(step) { index = step; tick(); }
      function stopAuto() { auto = false; autoButton.setAttribute('aria-pressed', 'false'); window.clearTimeout(timer); }
      function openFromPop() { if (auto) jump(5); else go('opened'); }
      function dismiss() { if (auto) jump(state === 'burst' ? 4 : 2); else go('dot'); }

      stateButtons.forEach(button => button.addEventListener('click', () => { stopAuto(); go(button.dataset.go); }));
      tabButtons.forEach(button => button.addEventListener('click', () => {
        const tab = button.dataset.tab;
        if (tab === 'alva') openFromPop();
        else if (tab === 'foryou') { if (auto) jump(0); else { setTab('foryou'); if (state === 'opened') go('idle'); } }
      }));
      autoButton.addEventListener('click', () => { auto = !auto; autoButton.setAttribute('aria-pressed', String(auto)); window.clearTimeout(timer); if (auto) jump(0); });
      window.addEventListener('resize', fit);

      fit();
      tick();
    })();
  </script>
  <script src="/demo/_switcher.js" defer></script>
